<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Техномагазин — Каталог</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Хедер -->
    <header>
        <div class="header-container">
            <div class="logo">Техномагазин</div>
            <div class="search-bar">
                <input type="text" placeholder="Поиск по названию...">
                <button>Найти</button>
            </div>
            <div class="header-icons">
                <div class="icon" id="cart-icon">🛒 <span id="cart-count">0</span></div>
                <div class="icon" id="account-icon">👤</div>
            </div>
        </div>
    </header>

    <!-- Уведомление -->
    <div class="notification" id="notification">
        <span id="notification-message">Текст сообщения</span>
        <span class="notification-close" id="notification-close">×</span>
    </div>

    <!-- Основной контент -->
    <div class="container">
        <div class="main-content">
            <!-- Сайдбар с фильтрами -->
            <div class="sidebar">
                <h3>Фильтры</h3>
                
                <div class="filter-section">
                    <h4>Категории</h4>
                    <div class="checkbox-group" id="categories-filter">
                        <!-- Динамически заполняется из JS -->
                    </div>
                </div>
                
                <div class="filter-section">
                    <h4>Стоимость</h4>
                    <div class="price-filter">
                        <div>
                            <label>От</label>
                            <input type="number" id="price-from" value="0" min="0">
                        </div>
                        <div>
                            <label>До</label>
                            <input type="number" id="price-to" value="10000" min="0">
                        </div>
                    </div>
                </div>
                
                <div class="filter-section">
                    <div class="checkbox-group">
                        <label><input type="checkbox" id="discount-only"> Только товары со скидками</label>
                    </div>
                </div>
                
                <button class="apply-button">Применить</button>
            </div>
            
            <!-- Каталог товаров -->
            <div class="catalog">
                <div class="catalog-header">
                    <h2 class="catalog-title">Каталог</h2>
                    <select class="sort-dropdown" id="sort-order">
                        <option value="rating_desc">По убыванию рейтинга</option>
                        <option value="rating_asc">По возрастанию рейтинга</option>
                        <option value="price_asc">По возрастанию цены</option>
                        <option value="price_desc">По убыванию цены</option>
                    </select>
                </div>
                
                <div class="goods-grid" id="goods-grid">
                    <div class="loading">Загрузка товаров...</div>
                </div>
                
                <button class="load-more" id="load-more">Загрузить ещё</button>
            </div>
        </div>
    </div>

    <!-- Футер -->
    <footer>
        <div class="footer-content">
            <p class="footer-text">© 2025 Техномагазин. Все права защищены.</p>
            <p class="footer-text">Контакты: info@technomagazin.ru | +7 (495) 123-45-67</p>
        </div>
    </footer>

    <script type="module" src="catalog.js"></script>
</body>
</html>
